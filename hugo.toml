baseURL = "https://diandre.varastyre.net/"
languageCode = "nb-no"
title = "Koret Diandre"
defaultContentLanguage = "nb"
disableAliases = true
theme = "PaperMod"

[params]
  dateFormat = "2. januar 2006"
  email = "leder@diandre.no"
  vipps = "658600"
  description = "Oslo-basert kor med groovy og stemningsfulle sanger"
  defaultTheme = "auto"           # respects dark mode
  ShowShareButtons = false
  ShowReadingTime = false
  mainSections = ["arrangement", "nyheter"]   # homepage lists events + news

[taxonomies]
  tag = "tags"

buildFuture = true

[outputs]
  home = ["HTML", "RSS"]

[services.googleAnalytics]
  ID = ""

[params.author]
  name = "Koret Diandre"

[[menus.main]]
  name = "Om oss"
  url = "/om"
  weight = 1
[[menus.main]]
  name = "Arrangement"
  url = "/arrangement"
  weight = 2
[[menus.main]]
  name = "Bli med"
  url = "/bli-med"
  weight = 3
[[menus.main]]
  name = "Kontakt"
  url = "/kontakt"
  weight = 4
